name: Bake pancakes

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]
  push:
    paths:
      - materials.txt
      - bake.py
      - .github/workflows/bake.yaml

permissions:
  contents: read

concurrency:
  group: bake-pancakes
  cancel-in-progress: false

jobs:
  update:
    name: Bake pancakes.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Generate pancakes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bake.py
      - name: Prepare pages
        run: |
          mkdir _pages
          cp pancakes.json _pages/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

  deploy:
    needs: update
    name: Deploy pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
