name: Bake pancakes

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]
  push:
    paths:
      - materials.txt

permissions:
  contents: write

concurrency:
  group: bake-pancakes
  cancel-in-progress: false

jobs:
  update:
    name: Bake pancakes.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Generate pancakes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bake.py
      - name: Commit pancakes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pancakes.json
          git diff --cached --quiet || git commit -m "Update pancakes.json"
          git push
